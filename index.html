<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin Skating Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #FFFFFF 50%, #F0F0F0 100%);
            border: 3px solid #333;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            font-size: 14px;
        }

        .sky {
            position: absolute;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            z-index: 1;
        }

        .ice {
            position: absolute;
            width: 100%;
            height: 50%;
            top: 50%;
            background: linear-gradient(to bottom, #FFFFFF, #F0F0F0);
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            color: white;
            font-size: 24px;
            z-index: 2;
            opacity: 0.7;
        }

        #penguin {
            position: absolute;
            width: 40px;
            height: 50px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 50"><ellipse cx="20" cy="25" rx="18" ry="22" fill="%23000"/><circle cx="20" cy="12" r="12" fill="%23000"/><circle cx="16" cy="9" r="4" fill="%23FFF"/><circle cx="24" cy="9" r="4" fill="%23FFF"/><circle cx="16" cy="9" r="2" fill="%23000"/><circle cx="24" cy="9" r="2" fill="%23000"/><ellipse cx="20" cy="38" rx="4" ry="6" fill="%23FF8C00"/><path d="M 15 35 L 12 38" stroke="%23FF8C00" stroke-width="1.5" fill="none"/><path d="M 25 35 L 28 38" stroke="%23FF8C00" stroke-width="1.5" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            z-index: 5;
            bottom: 50px;
            left: 380px;
            transition: transform 0.1s;
        }

        .fish {
            position: absolute;
            width: 30px;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20"><ellipse cx="15" cy="10" rx="10" ry="7" fill="%23FF6347"/><polygon points="25,10 32,5 32,15" fill="%23FF6347"/><circle cx="20" cy="8" r="2" fill="%23000"/></svg>') no-repeat center;
            background-size: contain;
            z-index: 3;
            top: 50%;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: #333;
            font-size: 16px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .hud div {
            margin: 5px 0;
        }

        .score-label, .lives-label {
            color: #667eea;
        }

        .score-value, .lives-value {
            color: #764ba2;
            font-size: 18px;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px 60px;
            border-radius: 10px;
            text-align: center;
            z-index: 20;
            display: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .game-over h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .game-over p {
            font-size: 24px;
            margin: 10px 0;
        }

        .game-over button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .game-over button:hover {
            background: #764ba2;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 10;
            text-align: center;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="sky"></div>
        <div class="ice"></div>
        <div id="penguin"></div>
        <div class="hud">
            <div><span class="score-label">Score:</span> <span class="score-value" id="score">0</span></div>
            <div><span class="lives-label">Lives:</span> <span class="lives-value" id="lives">3</span></div>
        </div>
        <div class="game-over" id="gameOver">
            <h1>Game Over!</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button onclick="location.reload()">Play Again</button>
        </div>
        <div class="instructions">← → Arrow Keys to Move | Catch Fish to Score!</div>
    </div>

    <script src="game.js"></script>
</body>
</html>
